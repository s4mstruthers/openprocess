# Test OpenProcess, and build the standalone OpenProcess Studio app for macOS, Windows and
# Linux.
#
# Nothing here can hang for long: the few Ubuntu packages Qt needs are kept
# in the Actions cache, so the runners' often very slow connection to
# Ubuntu's mirrors is only needed when the cache is empty
# (packaging/ci/install-qt-libraries.sh),
# every job has a time limit, and a test that hangs prints where it is stuck.
#
# When it runs: on a pull request (the code about to be merged), when a
# version tag is pushed (the release), and with "Run workflow" on the Actions
# tab.  Not on pushes to main: a merged pull request was built already, and a
# version bump is built by its tag -- building those again only queued the
# release behind duplicate runs.  A pull request that only changes
# documentation is not built, and a newer push to a pull request cancels its
# unfinished run.
#
# First the test suite runs (on Linux, offscreen); only if it passes are the
# apps built.  Worker processes start differently on each system, so each
# build job also runs the parallel-work and background-read tests from
# source, and the app's self-test runs them in the built app.  PyInstaller cannot cross-compile, so each app is built on a
# machine running that system.  Every run smoke-tests the app
# (packaging/build.py) and keeps the result as a downloadable artifact on the
# run's page.  Pushing a version
# tag (git tag v0.3.0 && git push origin v0.3.0) also publishes a GitHub
# Release with the downloads attached, described by the version's section
# of CHANGELOG.md.  (GitHub shows each download's SHA-256, which the app's
# updater, openprocess/gui/studio/updates.py, checks.)  The tag must match
# __version__ in openprocess/__init__.py, and CHANGELOG.md needs a section for it.

name: Build apps

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore:             # documentation only: nothing to test or build
      - "**.md"
      - "docs/**"
  workflow_dispatch:          # the "Run workflow" button on the Actions tab

# One run per pull request at a time: a newer push cancels the older run.
# (Release tags are never cancelled.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write             # only used by the release job, to attach the apps

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15       # the suite takes about a minute
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip              # reuse downloaded packages between runs
          cache-dependency-path: pyproject.toml

      - name: Keep Qt's system libraries between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/qt-debs
          key: qt-debs-${{ runner.os }}-${{ hashFiles('packaging/ci/install-qt-libraries.sh') }}

      - name: Install Qt's system libraries
        timeout-minutes: 15       # from the cache it takes seconds
        run: packaging/ci/install-qt-libraries.sh

      - name: Install OpenProcess with the app and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[app,dev]"

      - name: Run the test suite (the windows are drawn offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        # A test still running after two minutes prints where it is stuck.
        run: python -m pytest -q -o faulthandler_timeout=120

  build:
    name: ${{ matrix.name }}
    needs: tests              # no point building apps from code that fails its tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30       # a build takes a few minutes
    strategy:
      fail-fast: false        # one system failing should not cancel the others
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
          - name: macOS (Intel)
            os: macos-15-intel
          - name: Windows
            os: windows-latest
          - name: Linux
            # The oldest supported Ubuntu: an app built against an older
            # system library (glibc) also runs on newer distributions.
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip              # reuse downloaded packages between runs
          cache-dependency-path: pyproject.toml

      - name: Keep Qt's system libraries between runs
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/qt-debs
          key: qt-debs-${{ runner.os }}-${{ hashFiles('packaging/ci/install-qt-libraries.sh') }}

      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        # Installed here so PyInstaller bundles them: users then need fewer
        # libraries of their own.
        timeout-minutes: 15       # from the cache it takes seconds
        run: packaging/ci/install-qt-libraries.sh

      - name: Check the tag matches the version, and CHANGELOG.md says what is new
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' openprocess/__init__.py)
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "The tag ${{ github.ref_name }} does not match __version__ = $version in openprocess/__init__.py"
            exit 1
          fi
          python packaging/release_notes.py "$version" > /dev/null

      - name: Install OpenProcess and PyInstaller
        # mcp: the connector for AI assistants travels inside the app.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[app,mcp]" pyinstaller

      - name: Parallel work and background reads on this system (from source)
        # Workers are processes, started as macOS, Windows and Linux each do;
        # the results must equal the plain loop's on every one of them.
        timeout-minutes: 10
        run: |
          python -m pip install pytest
          python -m pytest -q -o faulthandler_timeout=120 tests/test_parallel_and_loading.py tests/test_parallel_boxes.py

      - name: Build and smoke-test the app
        run: python packaging/build.py

      - name: Keep the app as an artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenProcess-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: apps
          merge-multiple: true

      # The release's text is the version's section of CHANGELOG.md, written
      # for the people using the app: OpenProcess shows it when offering the update.
      - name: Release notes from CHANGELOG.md
        run: python3 packaging/release_notes.py "${{ github.ref_name }}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: apps/*
          body_path: release-notes.md

  # The same tag publishes the package on PyPI (`pip install openprocess`),
  # through PyPI's trusted publishing: no token is stored anywhere.  Set it up
  # once on pypi.org (the project's Publishing page): this repository, this
  # workflow file, environment "pypi".
  pypi:
    name: Publish to PyPI
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the source archive and the wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
