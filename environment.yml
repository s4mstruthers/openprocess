# Conda environment for OpenProcess (CPN editor + OpenProcess Studio).
#
#   conda env create -f environment.yml      # first time
#   conda activate openprocess
#   conda env update -f environment.yml --prune   # after pulling changes
#
# Python and the Qt bindings come from conda-forge (native builds for macOS,
# Windows and Linux).  OpenProcess itself is installed from this folder in *editable* mode
# ("-e ."), so edits to the source take effect without reinstalling.
name: openprocess
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pyside6>=6.6
  - certifi                  # certificates for the update check
  - pytest>=8.0
  - pip
  - pip:
      - -e .
      - mcp>=2.3               # the MCP server for AI assistants (openprocess mcp)
      # Optional extra miners and a live cross-check (AGPL-3.0); uncomment:
      # - pm4py>=2.7
