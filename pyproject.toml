# ---------------------------------------------------------------------------
# Build / packaging metadata for OpenProcess (the package on PyPI, and the app).
#
# We use the modern PEP 621 layout ([project] table) with setuptools as the
# build backend.  This is the least surprising choice for a pure-Python project
# and works with pip, uv, and py2app alike.
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openprocess"
# The version number lives in one place, openprocess/__init__.py (__version__): the
# package, the app's update check and the build script all read it from there.
dynamic = ["version"]
description = "Process mining, Petri nets and workflows in one open app: every algorithm visible, every result reproducible, every step teachable"
readme = "README.md"
# 3.10 is the floor: we use PEP 604 unions and structural pattern matching.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Struthers" }]
keywords = ["process mining", "petri nets", "workflow nets", "coloured petri nets", "event logs", "conformance checking", "teaching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]

# The engine's one runtime dependency is numpy: the arrays behind a large
# log (a million events in the dotted chart, the summaries, the filters) are
# worked out with it, and a box of your own can count on it.  Everything else
# (colour sets, the CPN ML interpreter, the simulator, the state space tool)
# is pure standard library, so the core imports from a notebook, a script or a
# test runner without dragging in a GUI toolkit.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The desktop application: `pip install openprocess[app]`.  Installed separately
# so that `import openprocess` stays cheap in a script, a notebook or a box of
# your own (PySide6 is ~150 MB).  `gui` is the same extra under its old name.
# certifi: the certificates the standalone app trusts when it checks GitHub for
# updates (its bundled Python cannot find the system's own).
# PySide6 6.12.0 is left out on Python 3.11 and older: there, each call of
# QApplication.processEvents() gives away a reference to None that it does not
# hold, and the interpreter stops ("none_dealloc") after some thousands of
# calls.  6.11 and earlier do not; Python 3.12 and newer are not affected.
app = ["PySide6>=6.6; python_version >= '3.12'", "PySide6>=6.6,!=6.12.0; python_version < '3.12'", "certifi"]
gui = ["PySide6>=6.6; python_version >= '3.12'", "PySide6>=6.6,!=6.12.0; python_version < '3.12'", "certifi"]
dev = ["pytest>=8.0", "mcp>=2.3", "ruff>=0.6"]
# The Science boxes (Describe log, Bootstrap fitness, Compare samples, Correlate,
# Plot) and the converters to pandas and matplotlib.  Each box says which of
# these it needs; without them it is listed greyed out.
science = ["pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
# The scikit-learn example model in examples/boxes/.
predict = ["scikit-learn>=1.3"]
# Optional: the ILP Miner, PM4Py's heuristics net, and a cross-check of the
# built-in algorithms.  PM4Py is AGPL-3.0 licensed.
pm4py = ["pm4py>=2.7"]
# The MCP server, for Claude and other AI assistants: `openprocess mcp`.
mcp = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/s4mstruthers/openprocess"
Changelog = "https://github.com/s4mstruthers/openprocess/blob/main/CHANGELOG.md"
Releases = "https://github.com/s4mstruthers/openprocess/releases"
Documentation = "https://github.com/s4mstruthers/openprocess#contents"
Issues = "https://github.com/s4mstruthers/openprocess/issues"

[project.scripts]
# Command-line entry points created by `pip install -e .`
openprocess = "openprocess.cli:main"
openprocess-mcp = "openprocess.mcp:main"

[project.gui-scripts]
openprocess-cpn = "openprocess.gui.app:main"
openprocess-studio = "openprocess.gui.studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "openprocess.__version__" }

[tool.setuptools.packages.find]
# cpnpy: the old name, a shim so `import cpnpy` and the boxes and packs written
# for it keep working (see cpnpy/__init__.py).
include = ["openprocess*", "cpnpy"]

# Installed packages can add boxes to the box list by declaring an entry point
# in this group, e.g. [project.entry-points."openprocess.boxes"] my_pack = "my_pack.boxes".
# (OpenProcess itself declares none; its boxes are found as openprocess.flow.boxes.)

[tool.setuptools.package-data]
"openprocess.gui" = ["resources/*.png"]
# The demo exercises (File ▸ Open Demo Exercises).
# py.typed: the code is annotated throughout; a type checker may use that in a box of your own.
"openprocess" = ["exercises/*.md", "exercises/*/*/*", "py.typed"]
# The guide shown by Help ▸ Writing Exercise Packs.
"openprocess.learn" = ["*.md"]
# The guide shown by Help ▸ Connect an AI Assistant, and served to assistants.
"openprocess.mcp" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint: `ruff check .` (CI runs it before the tests).  The rules are the ones
# that find mistakes -- a name that does not exist, an import nobody uses, a
# comparison that cannot be true -- not a house style: the code is laid out
# by hand, with lines up to about 120 characters.
[tool.ruff]
target-version = "py310"
line-length = 130
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B018", "PLE"]
# Layout, not mistakes: `a = 1; b = 2` on one line, a lambda with a name, a short loop variable.
ignore = ["E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# The old names (cpnpy, openprocess.teaching) re-export everything on purpose.
"cpnpy/__init__.py" = ["F401", "F403"]
"openprocess/teaching/*.py" = ["F401", "F403"]
