# ---------------------------------------------------------------------------
# Build / packaging metadata for OpenProcess (the package on PyPI, and the app).
#
# We use the modern PEP 621 layout ([project] table) with setuptools as the
# build backend.  This is the least surprising choice for a pure-Python project
# and works with pip, uv, and py2app alike.
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openprocess"
# The version number lives in one place, openprocess/__init__.py (__version__): the
# package, the app's update check and the build script all read it from there.
dynamic = ["version"]
description = "Process mining, Petri nets and workflows in one open app: every algorithm visible, every result reproducible, every step teachable"
readme = "README.md"
# 3.10 is the floor: we use PEP 604 unions and structural pattern matching.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Struthers" }]
keywords = ["process mining", "petri nets", "workflow nets", "coloured petri nets", "event logs", "conformance checking", "teaching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]

# The engine deliberately has ZERO runtime dependencies: colour sets, the CPN ML
# interpreter, the simulator and the state space tool are all pure standard
# library.  That keeps the core importable from a notebook, a script, or a test
# runner without dragging in a GUI toolkit.
dependencies = []

[project.optional-dependencies]
# The desktop application: `pip install openprocess[app]`.  Installed separately
# so that `import openprocess` stays cheap in a script, a notebook or a box of
# your own (PySide6 is ~150 MB).  `gui` is the same extra under its old name.
# certifi: the certificates the standalone app trusts when it checks GitHub for
# updates (its bundled Python cannot find the system's own).
app = ["PySide6>=6.6", "certifi"]
gui = ["PySide6>=6.6", "certifi"]
dev = ["pytest>=8.0", "mcp>=2.3"]
# The Science boxes (Describe log, Bootstrap fitness, Compare samples, Correlate,
# Plot) and the converters to pandas and matplotlib.  Each box says which of
# these it needs; without them it is listed greyed out.
science = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
# The scikit-learn example model in examples/boxes/.
predict = ["scikit-learn>=1.3"]
# Optional: the ILP Miner, PM4Py's heuristics net, and a cross-check of the
# built-in algorithms.  PM4Py is AGPL-3.0 licensed.
pm4py = ["pm4py>=2.7"]
# The MCP server, for Claude and other AI assistants: `openprocess mcp`.
mcp = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/s4mstruthers/openprocess"
Changelog = "https://github.com/s4mstruthers/openprocess/blob/main/CHANGELOG.md"
Releases = "https://github.com/s4mstruthers/openprocess/releases"

[project.scripts]
# Command-line entry points created by `pip install -e .`
openprocess = "openprocess.cli:main"
openprocess-mcp = "openprocess.mcp:main"

[project.gui-scripts]
openprocess-cpn = "openprocess.gui.app:main"
openprocess-studio = "openprocess.gui.studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "openprocess.__version__" }

[tool.setuptools.packages.find]
# cpnpy: the old name, a shim so `import cpnpy` and the boxes and packs written
# for it keep working (see cpnpy/__init__.py).
include = ["openprocess*", "cpnpy"]

# Installed packages can add boxes to the box list by declaring an entry point
# in this group, e.g. [project.entry-points."openprocess.boxes"] my_pack = "my_pack.boxes".
# (OpenProcess itself declares none; its boxes are found as openprocess.flow.boxes.)

[tool.setuptools.package-data]
"openprocess.gui" = ["resources/*.png"]
# The demo exercises (File ▸ Open Demo Exercises).
"openprocess" = ["exercises/*.md", "exercises/*/*/*"]
# The guide shown by Help ▸ Writing Exercise Packs.
"openprocess.learn" = ["*.md"]
# The guide shown by Help ▸ Connect an AI Assistant, and served to assistants.
"openprocess.mcp" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
